
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock FinMind Reports</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --accent: #3b82f6; --hover: #2563eb; }
        body { background: var(--bg); color: var(--text); font-family: "Microsoft JhengHei", sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        h1 { margin-bottom: 10px; font-weight: 700; }
        .subtitle { color: #94a3b8; margin-bottom: 40px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; width: 100%; max-width: 800px; padding: 20px; }
        .card { background: var(--card); padding: 30px; border-radius: 16px; text-align: center; transition: transform 0.2s, box-shadow 0.2s; text-decoration: none; color: var(--text); border: 1px solid #334155; display: flex; flex-direction: column; justify-content: center; height: 150px; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.3); border-color: var(--accent); }
        .icon { font-size: 40px; margin-bottom: 15px; }
        .title { font-size: 20px; font-weight: 600; margin-bottom: 5px; }
        .desc { font-size: 14px; color: #94a3b8; }
        footer { margin-top: 50px; color: #475569; font-size: 12px; }
    </style>
</head>
<body>
    <h1>Stock FinMind Reports</h1>
    <div class="subtitle">自動化股票分析與資料庫監控中心</div>

    <div class="grid">
        <a href="dashboard.html" class="card">
            <div class="icon">📊</div>
            <div class="title">市場戰情室</div>
            <div class="desc">Market Dashboard</div>
        </a>
        
        <a href="db_report.html" class="card">
            <div class="icon">💾</div>
            <div class="title">資料庫報告</div>
            <div class="desc">Database Status Report</div>
        </a>
    </div>

    <footer>
        Last Updated: 2026-01-27 14:41:09
    </footer>
</body>
</html>
